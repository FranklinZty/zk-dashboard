# 复制到项目仓库的 .github/workflows/lab-sync.yml
#
# 不需要配置任何 Secret：推送用 GitHub 签发的身份令牌认证（下面的 id-token: write），
# 看板只接受允许名单里的组织或用户的仓库，每个仓库只能更新自己的项目。
#
# 同步脚本从下面的 LAB_TOOLS_REPO 拉取（公开仓库），一般不用改。
name: lab-sync

on:
  push:          # 任何分支上的提交都算项目活动；看板以提交时间最新的那次为准
  schedule:
    - cron: "17 19 * * *"   # 每天北京时间 03:17 全量重推，用于补齐服务器停机期间的缺口
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # 申请 GitHub 身份令牌，用于向看板证明「这次推送来自本仓库」

concurrency:
  group: lab-sync
  cancel-in-progress: true

env:
  LAB_TOOLS_REPO: FranklinZty/zk-dashboard
  LAB_TOOLS_REF: main
  LAB_SYNC_URL: http://120.77.59.95/api/v1/ingest

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20

      - name: 获取同步脚本
        uses: actions/checkout@v7
        with:
          repository: ${{ env.LAB_TOOLS_REPO }}
          ref: ${{ env.LAB_TOOLS_REF }}
          path: .lab-tools
          sparse-checkout: client/lab_sync

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: 校验 project.yaml
        run: python .lab-tools/client/lab_sync/validate.py project.yaml --check-venues

      - name: 采集
        run: python .lab-tools/client/lab_sync/collect.py project.yaml -o "$RUNNER_TEMP/payload.json"

      - name: 推送到看板
        run: python .lab-tools/client/lab_sync/push.py "$RUNNER_TEMP/payload.json"
